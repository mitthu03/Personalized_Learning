services:
  - type: web
    name: personalized-learning-django
    env: docker
    dockerfilePath: Dockerfile
    rootDir: ./backend/django_core
    plan: free
    healthCheckPath: /api/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: FASTAPI_AI_BASE_URL
        value: https://personalized-learning-ai.onrender.com

  - type: web
    name: personalized-learning-ai
    env: docker
    dockerfilePath: Dockerfile
    rootDir: ./backend/fastapi_ai
    plan: free
    healthCheckPath: /health

  - type: web
    name: personalized-learning-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: ./frontend
    envVars:
      - key: VITE_DJANGO_API_BASE_URL
        sync: false
