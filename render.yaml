services:
  - type: web
    name: personalized-learning-django
    env: docker
    dockerfilePath: Dockerfile
    rootDir: ./backend/django_core
    healthCheckPath: /api/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: "Lax"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FASTAPI_AI_BASE_URL
        value: https://personalized-learning-ai.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: personalized-learning-db
          property: connectionString

  - type: web
    name: personalized-learning-ai
    env: docker
    dockerfilePath: Dockerfile
    rootDir: ./backend/fastapi_ai
    healthCheckPath: /health

  - type: static_site
    name: personalized-learning-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: ./frontend
    envVars:
      - key: VITE_DJANGO_API_BASE_URL
        sync: false

databases:
  - name: personalized-learning-db
    plan: free
